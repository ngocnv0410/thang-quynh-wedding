name: Build and deploy wedding invitation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install browser for UI verification
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firebase persistence and Firestore rules
        run: npm run test:firebase
      - name: Verify responsive layout and interactions
        run: npm run test:ui
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            playwright-report/
            test-results/
            playwright-firebase-report/
            test-results-firebase/
          retention-days: 14
      - name: Build with Firebase Repository Secrets
        run: |
          node scripts/check-build-env.mjs
          npm run build
        env:
          # Custom domain serves the invitation at the site root.
          BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages(context.repo);
              core.setOutput("enabled", "true");
            } catch (error) {
              if (![403, 404].includes(error.status)) throw error;
              core.setOutput("enabled", "false");
              core.notice("Build passed. Enable GitHub Pages with source GitHub Actions in repository Settings, then rerun this workflow to deploy.");
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
